name: Prepare Collector Crypt data (no UI deployment)
on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours, ~11 calls per run
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Collector Crypt listings
        env:
          CC_PROXY_KEY: ${{ secrets.CC_PROXY_KEY }}
        run: python scripts/fetch_raw.py /tmp/raw_cc.json
      - name: Build data (keeps last good file if bad)
        run: python scripts/build_cc.py /tmp/raw_cc.json data/cc.json
      - name: Update history
        run: python scripts/update_history.py
      - name: Read Gacha Mark history from chain (keeps last good file if it fails)
        run: python scripts/fetch_onchain.py
      # Never push to a Pages-connected branch: even a data-only commit may
      # deploy the repository's stale UI. Promotion belongs to a reviewed UI
      # release built with scripts/safe_build.py, not this scheduled job.
      - name: Save refreshed data for explicit review (no repository writes)
        uses: actions/upload-artifact@v4
        with:
          name: collector-data-${{ github.run_id }}
          path: |
            data/cc.json
            data/history.json
            src/onchain.json
          if-no-files-found: error
          retention-days: 7
      - name: Alert if anything failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Price refresh failed $(date -u '+%d %b %H:%M UTC')" \
            --body "The Collector Crypt price refresh failed. The site still shows the last good prices. Run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
