<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Price Passport preview (fixtures)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6fb;--panel:#fff;--line:rgba(20,16,40,.09);--line2:rgba(20,16,40,.16);--txt:#15121f;--mut:#3d3a4a;--dim:#6f6b80;--pur:#7c3aed;--grn:#0c8f63;--amb:#b45309;--red:#c2410c;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}
.w{max-width:1120px;margin:0 auto;padding:28px 20px 60px}.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ban{background:#fff4e5;border:1px solid #f5c58a;color:#7a3d00;border-radius:12px;padding:12px 16px;font-size:14px;margin-bottom:22px}
.ban b{font-weight:700}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--pur)}
h1{font-size:34px;line-height:1.1;margin:10px 0 6px;letter-spacing:-.02em}.sub{color:var(--mut);margin:0 0 24px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.mk h3{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.big{font:700 34px/1.1 var(--mono);margin:6px 0}.meta{color:var(--dim);font-size:13px}
.rt{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.rt h2{font-size:18px;margin:0 0 2px}.rt .meta{margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:7px 0;border-bottom:1px solid var(--line)}td.r{text-align:right}
tr.tot td{font-weight:700;border-bottom:1px solid var(--line2)}
.res{margin-top:14px;padding:12px 14px;border-radius:12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.res.pos{background:#e4f8ef;color:var(--grn)}.res.neg{background:#fdeee6;color:var(--red)}.res b{font:700 22px var(--mono)}
.pill{display:inline-block;font:600 11px/1 var(--mono);padding:5px 8px;border-radius:99px;background:#f1effa;color:var(--mut)}
.pill.u{background:#fff4e5;color:var(--amb)}
h2.s{font-size:18px;margin:26px 0 10px}
.proof{display:grid;grid-template-columns:1fr 1fr;gap:16px}.proof td{font-size:13px}
.note{color:var(--dim);font-size:13px;margin-top:10px}
@media(max-width:760px){.mk,.rt,.proof{grid-template-columns:1fr}h1{font-size:27px}.big{font-size:28px}}
</style></head><body><div class="w">
<div class="ban"><b>Internal preview. All numbers are made-up test fixtures</b>, not real sales, fees, duties, taxes or exchange rates. Not for publishing.</div>
<div class="eyebrow">Price Passport</div><h1 id="t"></h1><p class="sub" id="st"></p>
<div class="mk" id="mk"></div><div class="rt" id="rt"></div>
<h2 class="s">See the proof</h2><div class="proof" id="pf"></div>
<p class="note" id="nt"></p>
</div>
<script>
__PASSPORT_JS__
__FIXTURES__
const P=ppPassport(FX.card,FX.jp,FX.us,FX.rates,FX.now);
const fmt=(v,c)=>(v<0?'−':'')+(c==='JPY'?'¥'+Math.round(Math.abs(v)).toLocaleString('en-US'):'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}));
const fd=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
const NAME={JP:'Japan',US:'United States'};
document.getElementById('t').textContent=FX.card.title;
document.getElementById('st').textContent=FX.card.subtitle;
document.getElementById('mk').innerHTML=Object.entries(P.markets).map(([m,r])=>`<div class="panel"><h3>${NAME[m]} · median sale</h3><div class="big num">${fmt(r.median,r.currency)}</div><div class="meta">${r.n} sales, ${fd(r.from)} to ${fd(r.to)} · same grade, same language</div></div>`).join('');
document.getElementById('rt').innerHTML=P.routes.map(r=>{const [a,b]=r.route.split('>');const L=r.lines;
 return `<div class="panel"><h2>Buy in ${NAME[a]}, sell in ${NAME[b]}</h2><div class="meta">All figures in ${r.currency} <span class="pill ${r.verified?'':'u'}">${r.verified?'Rates checked':'Rates not checked'}</span></div>
 <table>${L.map(([k,v])=>`<tr class="${k==='Landed cost'||k==='Net from sale'?'tot':''}"><td>${k}${k==='Import tax'&&r.deMinimisApplied?' <span class="meta">(under threshold)</span>':''}</td><td class="r num">${fmt(v,r.currency)}</td></tr>`).join('')}</table>
 <div class="res ${r.margin>=0?'pos':'neg'}"><span>${r.margin>=0?'Gain after all costs':'Loss after all costs'}</span><b class="num">${fmt(r.margin,r.currency)} · ${r.marginPct>0?'+':''}${r.marginPct}%</b></div></div>`}).join('');
document.getElementById('pf').innerHTML=Object.entries(P.markets).map(([m,r])=>`<div class="panel"><h3 style="margin:0 0 8px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em">${NAME[m]} sales used</h3><table>${r.sales.map(s=>`<tr><td>${fd(s.date)}</td><td>${s.grader} ${s.grade} · ${s.lang}</td><td class="r num">${fmt(s.price,s.currency)}</td></tr>`).join('')}</table>${r.otherLang?`<div class="note">${r.otherLang} sale${r.otherLang===1?'':'s'} of the other-language version left out.</div>`:''}</div>`).join('');
document.getElementById('nt').textContent='Medians of completed sales in the last 90 days, same grader, grade and card language. Fees, shipping, duty, tax and exchange rate are inputs per route; a missing input stops the calculation instead of guessing. Status: '+P.status+'.';
</script></body></html>
